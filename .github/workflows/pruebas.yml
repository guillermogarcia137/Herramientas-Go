name: Probar y compilar Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o dist/ ./...
      - uses: actions/upload-artifact@v4
        with:
          name: herramientas-go-${{ matrix.os }}
          path: dist/
